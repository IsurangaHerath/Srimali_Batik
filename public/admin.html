<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Srimali Batik</title>
    
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦋</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/styles.css">
    
    <style>
        /* Admin Theme Toggle - Round */
        .admin-panel .theme-toggle,
        .admin-actions .theme-toggle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #f5f0e8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid #e0d8cc;
        }
        
        .admin-panel .theme-toggle:hover,
        .admin-actions .theme-toggle:hover {
            background: linear-gradient(135deg, #b8860b, #d4a84b);
            border-color: #b8860b;
            transform: rotate(15deg);
        }

        /* Color Checkbox List */
        .color-checkbox-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        
        .color-checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
            min-height: 44px;
        }
        
        .color-checkbox-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.4);
        }
        
        .color-checkbox-item.selected {
            background: rgba(184, 134, 11, 0.3);
            border-color: #b8860b;
        }
        
        .color-checkbox-item input {
            display: none;
        }
        
        .color-checkbox-item .color-chip {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            flex-shrink: 0;
        }
        
        .color-checkbox-item .color-label {
            color: #fff;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <!-- ADMIN PANEL -->
    <div class="admin-panel active" id="adminPanelEl">
        <div class="admin-container">
            <div class="admin-header">
                <h1>Admin Panel</h1>
                <div class="admin-actions">
                    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode">🌙</button>
                    <a href="/" class="btn btn-secondary">← Back to Site</a>
                </div>
            </div>

            <div class="admin-tabs">
                <button class="admin-tab active" data-tab="patterns">Patterns</button>
                <button class="admin-tab" data-tab="products">Products</button>
                <button class="admin-tab" data-tab="colors">Colors</button>
            </div>

            <!-- Patterns Tab -->
            <div class="admin-tab-content" id="tab-patterns">
                <div class="admin-card">
                    <div class="admin-card-header">
                        <h3 class="admin-card-title">Manage Patterns</h3>
                        <button class="btn btn-primary btn-sm" onclick="adminPanel.openPatternModal()">+ Add Pattern</button>
                    </div>
                    <div class="admin-list" id="patternsList"></div>
                </div>
            </div>

            <!-- Products Tab -->
            <div class="admin-tab-content" id="tab-products" style="display: none;">
                <div class="admin-card">
                    <div class="admin-card-header">
                        <h3 class="admin-card-title">Manage Products</h3>
                        <button class="btn btn-primary btn-sm" onclick="adminPanel.openProductModal()">+ Add Product</button>
                    </div>
                    <div class="admin-list" id="productsList"></div>
                </div>
            </div>

            <!-- Colors Tab -->
            <div class="admin-tab-content" id="tab-colors" style="display: none;">
                <div class="admin-card">
                    <div class="admin-card-header">
                        <h3 class="admin-card-title">Manage Colors</h3>
                        <button class="btn btn-primary btn-sm" onclick="adminPanel.openColorModal()">+ Add Color</button>
                    </div>
                    <div class="admin-list" id="colorsList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Pattern Modal -->
    <div class="modal" id="patternModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="patternModalTitle">Add Pattern</h2>
                <button class="modal-close" onclick="adminPanel.closeModal('patternModal')">&times;</button>
            </div>
            <form class="admin-form" id="patternForm" onsubmit="adminPanel.savePattern(event)">
                <input type="hidden" id="patternId">
                <div class="form-group">
                    <label>Pattern Name</label>
                    <input type="text" id="patternName" required placeholder="e.g., Floral Elegance">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="patternDescription" required placeholder="e.g., Handmade floral batik design"></textarea>
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" id="patternImage" placeholder="https://example.com/image.jpg" oninput="adminPanel.previewImage(this.value)">
                    <small class="text-muted">Paste a cloud image URL</small>
                </div>
                <div class="form-group">
                    <label>Image Preview</label>
                    <div class="image-preview" id="imagePreview"></div>
                </div>
                <div class="form-group">
                    <label>Available Colors</label>
                    <small class="text-muted">Select colors available for this pattern</small>
                    <div id="patternColorsContainer" class="color-checkbox-list"></div>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary">Save Pattern</button>
                    <button type="button" class="btn btn-secondary" onclick="adminPanel.closeModal('patternModal')">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Product Modal -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="productModalTitle">Add Product</h2>
                <button class="modal-close" onclick="adminPanel.closeModal('productModal')">&times;</button>
            </div>
            <form class="admin-form" id="productForm" onsubmit="adminPanel.saveProduct(event)">
                <input type="hidden" id="productId">
                <div class="form-group">
                    <label>Pattern</label>
                    <select id="productPattern" required></select>
                </div>
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="productName" required placeholder="e.g., Floral Saree">
                </div>
                <div class="form-group">
                    <label>Product Type</label>
                    <select id="productType" required>
                        <option value="Saree">Saree</option>
                        <option value="Frock">Frock</option>
                        <option value="Sarong">Sarong</option>
                        <option value="Shirt">Shirt</option>
                        <option value="Dress">Dress</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="productDescription" required placeholder="e.g., Beautiful handmade saree"></textarea>
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" id="productImage" placeholder="https://example.com/product.jpg" oninput="adminPanel.previewProductImage(this.value)">
                </div>
                <div class="form-group">
                    <label>Image Preview</label>
                    <div class="image-preview" id="productImagePreview"></div>
                </div>
                <div class="form-group">
                    <label>Price (Optional)</label>
                    <input type="text" id="productPrice" placeholder="e.g., 15,000 LKR">
                </div>
                <div class="form-group">
                    <label>Available Colors</label>
                    <small class="text-muted">Select colors available for this product</small>
                    <div id="productColorsContainer" class="color-checkbox-list"></div>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary">Save Product</button>
                    <button type="button" class="btn btn-secondary" onclick="adminPanel.closeModal('productModal')">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Color Modal -->
    <div class="modal" id="colorModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="colorModalTitle">Add Color</h2>
                <button class="modal-close" onclick="adminPanel.closeModal('colorModal')">&times;</button>
            </div>
            <form class="admin-form" id="colorForm" onsubmit="adminPanel.saveColor(event)">
                <input type="hidden" id="colorId">
                <div class="form-group">
                    <label>Color Name</label>
                    <input type="text" id="colorName" required placeholder="e.g., Green">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Hex Color</label>
                        <input type="color" id="colorHex" required value="#2d5a27">
                    </div>
                    <div class="form-group">
                        <label>Dark Hex</label>
                        <input type="color" id="colorDarkHex" required value="#1e4d1a">
                    </div>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary">Save Color</button>
                    <button type="button" class="btn btn-secondary" onclick="adminPanel.closeModal('colorModal')">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- External JavaScript -->
    <script src="js/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/admin.js"></script>
    <script>
        // Initialize admin on load
        document.addEventListener('DOMContentLoaded', async () => {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            const themeToggle = document.getElementById('themeToggle');
            if (themeToggle) {
                themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
                themeToggle.addEventListener('click', () => {
                    const currentTheme = document.documentElement.getAttribute('data-theme');
                    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', newTheme);
                    localStorage.setItem('theme', newTheme);
                    themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
                });
            }
            
            // Wait for data to load before init
            await dataManager.loadData();
            adminPanel.init();
        });
    </script>
</body>
</html>
