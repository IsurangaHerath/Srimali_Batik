[build]
  functions = "netlify/functions"
  publish = "public"

# API Redirects MUST come first and MUST be forced
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Explicit redirect for admin to ensure it doesn't get caught by index.html too early
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
  force = true

# Catch-all for SPA routing (only if file doesn't exist)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
