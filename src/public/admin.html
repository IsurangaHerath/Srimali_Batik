<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Srimali Batik</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦋</text></svg>">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/styles/tokens.css">
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/components/buttons.css">
    <link rel="stylesheet" href="/styles/components/cards.css">
    <link rel="stylesheet" href="/styles/components/forms.css">
    <link rel="stylesheet" href="/styles/components/modals.css">
    <link rel="stylesheet" href="/styles/components/toasts.css">
    <link rel="stylesheet" href="/styles/components/skeleton.css">
    <link rel="stylesheet" href="/styles/layouts/navbar.css">
    <link rel="stylesheet" href="/styles/layouts/grid.css">
    <link rel="stylesheet" href="/styles/pages/admin.css">
</head>
<body>
    <!-- Admin Layout -->
    <div class="admin-layout">
        <!-- Header -->
        <div class="admin-header">
            <h1>Admin Panel</h1>
            <div class="admin-actions">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode">🌙</button>
                <a href="/" class="admin-back-btn">← Back to Site</a>
            </div>
        </div>

        <!-- Tabs -->
        <div class="admin-tabs" role="tablist" aria-label="Admin sections">
            <button class="admin-tab active" data-tab="patterns" role="tab" aria-selected="true">Patterns</button>
            <button class="admin-tab" data-tab="products" role="tab" aria-selected="false">Products</button>
            <button class="admin-tab" data-tab="colors" role="tab" aria-selected="false">Colors</button>
        </div>

        <!-- Tab Contents -->
        <div class="admin-container">
            <!-- Patterns Tab -->
            <div class="admin-tab-content active" id="tab-patterns" role="tabpanel">
                <div class="admin-card">
                    <div class="admin-card-header">
                        <h3 class="admin-card-title">Manage Patterns</h3>
                        <button class="btn btn-primary btn-sm" onclick="window.adminActions.editPattern(null)" aria-label="Add new pattern">+ Add Pattern</button>
                    </div>
                    <div class="admin-list" id="patternsList">
                        <!-- Rendered by JS -->
                    </div>
                </div>
            </div>

            <!-- Products Tab -->
            <div class="admin-tab-content" id="tab-products" role="tabpanel">
                <div class="admin-card">
                    <div class="admin-card-header">
                        <h3 class="admin-card-title">Manage Products</h3>
                        <button class="btn btn-primary btn-sm" onclick="window.adminActions.editProduct(null)" aria-label="Add new product">+ Add Product</button>
                    </div>
                    <div class="admin-list" id="productsList">
                        <!-- Rendered by JS -->
                    </div>
                </div>
            </div>

            <!-- Colors Tab -->
            <div class="admin-tab-content" id="tab-colors" role="tabpanel">
                <div class="admin-card">
                    <div class="admin-card-header">
                        <h3 class="admin-card-title">Manage Colors</h3>
                        <button class="btn btn-primary btn-sm" onclick="window.adminActions.editColor(null)" aria-label="Add new color">+ Add Color</button>
                    </div>
                    <div class="admin-list" id="colorsList">
                        <!-- Rendered by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Pattern Modal -->
    <div class="modal-overlay" id="patternModal" role="dialog" aria-modal="true" aria-labelledby="patternModalTitle">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="patternModalTitle">Add Pattern</h2>
                <button class="modal-close" onclick="document.getElementById('patternModal').classList.remove('active')" aria-label="Close modal">&times;</button>
            </div>
            <form class="modal-body" id="patternForm">
                <input type="hidden" name="patternId" id="patternId">
                <div class="form-group">
                    <label class="form-label" for="patternName">Pattern Name *</label>
                    <input type="text" class="form-input" id="patternName" name="patternName" required placeholder="e.g., Floral Elegance">
                </div>
                <div class="form-group">
                    <label class="form-label" for="patternDescription">Description</label>
                    <textarea class="form-textarea" id="patternDescription" name="patternDescription" placeholder="Describe this batik pattern..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label" for="patternImage">Image URL</label>
                    <input type="url" class="form-input" id="patternImage" name="patternImage" placeholder="https://example.com/image.jpg">
                    <p class="form-hint">Paste an image URL from the cloud</p>
                </div>
                <div class="form-group">
                    <label class="form-label">Image Preview</label>
                    <div class="image-preview" id="patternImagePreview"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">Available Colors</label>
                    <div id="patternColorsContainer" class="color-checkbox-list"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" onclick="document.getElementById('patternModal').classList.remove('active')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Pattern</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Product Modal -->
    <div class="modal-overlay" id="productModal" role="dialog" aria-modal="true" aria-labelledby="productModalTitle">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="productModalTitle">Add Product</h2>
                <button class="modal-close" onclick="document.getElementById('productModal').classList.remove('active')" aria-label="Close modal">&times;</button>
            </div>
            <form class="modal-body" id="productForm">
                <input type="hidden" name="productId" id="productId">
                <div class="form-group">
                    <label class="form-label" for="productPattern">Pattern *</label>
                    <select class="form-select" id="productPattern" name="productPattern" required></select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="productName">Product Name *</label>
                    <input type="text" class="form-input" id="productName" name="productName" required placeholder="e.g., Floral Saree">
                </div>
                <div class="form-group">
                    <label class="form-label" for="productType">Product Type *</label>
                    <select class="form-select" id="productType" name="productType" required>
                        <option value="Saree">Saree</option>
                        <option value="Frock">Frock</option>
                        <option value="Sarong">Sarong</option>
                        <option value="Shirt">Shirt</option>
                        <option value="Dress">Dress</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="productDescription">Description</label>
                    <textarea class="form-textarea" id="productDescription" name="productDescription" placeholder="Describe this product..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label" for="productImage">Image URL</label>
                    <input type="url" class="form-input" id="productImage" name="productImage" placeholder="https://example.com/product.jpg">
                </div>
                <div class="form-group">
                    <label class="form-label">Image Preview</label>
                    <div class="image-preview" id="productImagePreview"></div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="productPrice">Price</label>
                    <input type="text" class="form-input" id="productPrice" name="productPrice" placeholder="e.g., 15,000 LKR">
                </div>
                <div class="form-group">
                    <label class="form-label">Available Colors</label>
                    <div id="productColorsContainer" class="color-checkbox-list"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" onclick="document.getElementById('productModal').classList.remove('active')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Color Modal -->
    <div class="modal-overlay" id="colorModal" role="dialog" aria-modal="true" aria-labelledby="colorModalTitle">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="colorModalTitle">Add Color</h2>
                <button class="modal-close" onclick="document.getElementById('colorModal').classList.remove('active')" aria-label="Close modal">&times;</button>
            </div>
            <form class="modal-body" id="colorForm">
                <input type="hidden" name="colorId" id="colorId">
                <div class="form-group">
                    <label class="form-label" for="colorName">Color Name *</label>
                    <input type="text" class="form-input" id="colorName" name="colorName" required placeholder="e.g., Emerald Green">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="colorHex">Hex Color *</label>
                        <input type="color" class="form-input" id="colorHex" name="colorHex" required value="#2d5a27">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="colorDarkHex">Dark Hex</label>
                        <input type="color" class="form-input" id="colorDarkHex" name="colorDarkHex" required value="#1e4d1a">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" onclick="document.getElementById('colorModal').classList.remove('active')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Color</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Entry Point -->
    <script type="module" src="/src/admin/index.ts"></script>
</body>
</html>
